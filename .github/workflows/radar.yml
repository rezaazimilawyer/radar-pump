name: Pump Radar
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
                run: python3 pump_radar.py --chains solana base eth bsc arbitrum polygon_pos avalanche optimism --top 10 --send-above 45
