name: Pump Radar

on:
  schedule:
    # هر ۵ دقیقه (UTC) — کمترین فاصلهٔ ممکن در گیت‌هاب
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run radar
        run: TG_TOKEN="${{ secrets.TG_TOKEN }}" TG_CHAT="${{ secrets.TG_CHAT }}" python3 pump_radar.py --chains solana base eth bsc arbitrum polygon_pos avalanche optimism --top 10 --send-above 45 --telegram
