name: Pump Radar
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: pump-radar
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: TG_TOKEN="${{ secrets.TG_TOKEN }}" TG_CHAT="${{ secrets.TG_CHAT }}" python3 pump_radar.py --chains solana base eth bsc arbitrum polygon_pos avalanche optimism --top 10 --send-above 45 --telegram
--allow-risk-off
